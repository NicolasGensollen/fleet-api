# ============================================================================
# TD 2, étape 3 — workflow de référence
#
# À placer dans .github/workflows/ci.yml
#
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name : Vérifier les règles de style
        run: uv run ruff check .
      - name: Vérifier le formatage
        run: uv run ruff format --check .
    
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests et Couverture
        run: uv run pytest -v --cov=fleet_api --cov-report=html --cov-report=term
      - uses: actions/upload-artifact@v7
        with:
          name: couverture-py${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: uv build
